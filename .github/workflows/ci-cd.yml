name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Install MongoDB Database Tools
        run: |
          curl -fsSL https://fastdl.mongodb.org/tools/db/mongodb-database-tools-ubuntu2204-x86_64-100.10.0.deb -o tools.deb
          sudo apt-get install -y ./tools.deb
      - name: End-to-end backup and restore drill
        env:
          MONGODB_URI: mongodb://localhost:27017
          BACKUP_DIR: ${{ runner.temp }}/backups
        run: |
          python scripts/seed.py
          NAME=$(python -m app.backup create | python -c "import sys,json; print(json.load(sys.stdin)['name'])")
          python -m app.backup verify "$NAME"

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
