services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: notesdb
      ADMIN_TOKEN: ${ADMIN_TOKEN:-change-me}
      BACKUP_KEEP: "7"
    volumes:
      - backups:/data/backups
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
  backups:
