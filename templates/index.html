<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estrategia de Backup NoSQL</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --fg:#e2e8f0; --mut:#94a3b8; --acc:#10b981; --bad:#ef4444; }
  * { box-sizing:border-box; }
  body { margin:0; font:16px system-ui,sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:880px; margin:0 auto; padding:24px 16px; display:grid; gap:20px; }
  h1 { margin:0; } h2 { margin:0 0 12px; font-size:1.1rem; }
  section { background:var(--card); border-radius:12px; padding:16px; }
  input, button { font:inherit; padding:8px 12px; border-radius:8px; border:1px solid #334155; background:#0f172a; color:var(--fg); }
  button { background:var(--acc); color:#04130d; border:0; cursor:pointer; font-weight:600; }
  button.ghost { background:transparent; color:var(--fg); border:1px solid #334155; }
  button.danger { background:var(--bad); color:#fff; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  .row input { flex:1; min-width:160px; }
  ul { list-style:none; padding:0; margin:0; display:grid; gap:8px; }
  li { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:8px 10px; background:#0f172a; border-radius:8px; flex-wrap:wrap; }
  small { color:var(--mut); }
  pre { background:#0f172a; padding:10px; border-radius:8px; overflow:auto; margin:10px 0 0; }
</style>
</head>
<body>
<main>
  <div>
    <h1>Estrategia de Backup NoSQL</h1>
    <small>MongoDB · mongodump · simulacros de restauración</small>
  </div>

  <section>
    <h2>Notas (datos en vivo)</h2>
    <form class="row" id="noteForm"><input id="text" placeholder="Escribe una nota" required><button>Agregar</button></form>
    <ul id="notes"></ul>
  </section>

  <section>
    <h2>Backups</h2>
    <div class="row">
      <input id="token" type="password" placeholder="Token de administrador">
      <button id="make">Crear backup</button>
      <button class="ghost" id="refresh">Actualizar</button>
    </div>
    <ul id="backups"></ul>
    <pre id="out" hidden></pre>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const hdr = () => ({ "Content-Type": "application/json", "X-Admin-Token": $("token").value });
const show = data => { $("out").hidden = false; $("out").textContent = JSON.stringify(data, null, 2); };

async function loadNotes() {
  const notes = await (await fetch("/api/notes")).json();
  $("notes").innerHTML = "";
  for (const n of notes) {
    const li = document.createElement("li");
    li.innerHTML = '<span></span><button class="danger">Eliminar</button>';
    li.firstChild.textContent = n.text;
    li.lastChild.onclick = async () => { await fetch("/api/notes/" + n._id, { method: "DELETE" }); loadNotes(); };
    $("notes").append(li);
  }
}

async function loadBackups() {
  const res = await fetch("/api/backups", { headers: hdr() });
  if (!res.ok) { $("backups").innerHTML = "<li><small>Ingresa un token de administrador válido</small></li>"; return; }
  $("backups").innerHTML = "";
  for (const b of await res.json()) {
    const li = document.createElement("li");
    li.innerHTML = '<span><b></b><br><small></small></span><span><button class="ghost">Verificar</button> <button class="danger">Restaurar</button></span>';
    li.querySelector("b").textContent = b.name;
    li.querySelector("small").textContent = (b.size_bytes / 1024).toFixed(1) + " KB · " + JSON.stringify(b.counts);
    const [verify, restore] = li.querySelectorAll("button");
    verify.onclick = async () => show(await (await fetch("/api/backups/" + b.name + "/verify", { method: "POST", headers: hdr() })).json());
    restore.onclick = async () => {
      if (!confirm("La restauración reemplaza los datos actuales. ¿Continuar?")) return;
      show(await (await fetch("/api/backups/" + b.name + "/restore", { method: "POST", headers: hdr() })).json());
      loadNotes();
    };
    $("backups").append(li);
  }
}

$("noteForm").onsubmit = async e => {
  e.preventDefault();
  await fetch("/api/notes", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text: $("text").value }) });
  $("text").value = "";
  loadNotes();
};
$("make").onclick = async () => { show(await (await fetch("/api/backups", { method: "POST", headers: hdr() })).json()); loadBackups(); };
$("refresh").onclick = loadBackups;
loadNotes();
</script>
</body>
</html>
